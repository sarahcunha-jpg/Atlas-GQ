<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard - Atlas Gestão</title>

<style>

/* ================================
   RESET
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f4f7fb;
    color: #263238;
}


/* ================================
   SISTEMA
================================ */

#sistema {
    display: flex;
    min-height: 100vh;
}


/* ================================
   MENU LATERAL
================================ */

#menu {
    width: 260px;
    min-height: 100vh;

    background: #ffffff;

    border-right: 1px solid #e5e9ef;

    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;

    z-index: 1000;

    display: flex;
    flex-direction: column;

    transition: transform .25s ease;
}


/* LOGO */

.logo {
    height: 76px;

    display: flex;
    align-items: center;

    padding: 0 22px;

    font-size: 20px;
    font-weight: 700;

    color: #2864d7;

    border-bottom: 1px solid #edf0f4;
}

.logo-symbol {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #2864d7;
    color: white;

    border-radius: 9px;

    margin-right: 10px;

    font-size: 18px;
}


/* TÍTULO MENU */

.menu-titulo {
    padding: 25px 20px 12px;

    font-size: 11px;
    font-weight: 700;

    color: #8a949f;

    letter-spacing: 1px;
}


/* LINKS */

#menu nav {
    padding: 0 12px;
}

#menu nav a {
    display: block;

    padding: 13px 15px;

    margin-bottom: 3px;

    border-radius: 8px;

    color: #4e5965;

    text-decoration: none;

    font-size: 14px;

    transition: .2s;
}

#menu nav a:hover {
    background: #f0f4fb;
    color: #2864d7;
}

#menu nav a.ativo {
    background: #2864d7;
    color: white;
    font-weight: 600;
}


/* BOTÃO SAIR */

.btn-menu-sair {
    margin: auto 12px 20px;

    padding: 12px;

    border: 0;

    border-radius: 8px;

    background: #f5f6f8;

    color: #555;

    cursor: pointer;

    font-size: 14px;
}

.btn-menu-sair:hover {
    background: #ffecec;
    color: #d33;
}


/* BOTÃO FECHAR */

#fecharMenu {
    display: none;

    position: absolute;

    top: 15px;
    right: 15px;

    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 8px;

    background: #f0f2f5;

    color: #444;

    font-size: 22px;

    cursor: pointer;
}


/* ================================
   CONTEÚDO PRINCIPAL
================================ */

main {
    margin-left: 260px;

    width: calc(100% - 260px);

    min-height: 100vh;
}


/* ================================
   TOPBAR
================================ */

.topbar {
    min-height: 76px;

    background: white;

    border-bottom: 1px solid #e6eaf0;

    display: flex;
    align-items: center;

    justify-content: space-between;

    padding: 15px 30px;
}

.topbar h1,
.topbar h2 {
    font-size: 25px;

    color: #202832;

    margin-bottom: 5px;
}

.topbar p {
    font-size: 13px;
    color: #89929d;
}


/* USUÁRIO */

.usuario-area {
    text-align: right;
}

.usuario-nome {
    font-size: 14px;
    font-weight: 700;
    color: #28323d;
}

.usuario-perfil {
    font-size: 12px;
    color: #8b949e;

    margin-top: 3px;
}


/* BOTÃO MOBILE */

.menu-mobile {
    display: none;

    width: 42px;
    height: 42px;

    border: 1px solid #dce1e7;

    background: white;

    border-radius: 8px;

    font-size: 22px;

    cursor: pointer;
}


/* ================================
   CONTEÚDO
================================ */

#conteudo {
    padding: 28px;
}


/* ================================
   CARDS
================================ */

.cards-dashboard {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 18px;

    margin-bottom: 22px;
}

.card {
    background: white;

    border: 1px solid #e8ecf1;

    border-radius: 14px;

    box-shadow:
        0 5px 20px rgba(30, 55, 90, .05);

    padding: 22px;
}


/* INDICADOR */

.indicador-card {
    display: flex;
    align-items: center;

    gap: 15px;

    min-height: 105px;
}

.indicador-icon {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    font-size: 20px;
    font-weight: 700;
}

.indicador-icon.azul {
    background: #edf4ff;
    color: #2864d7;
}

.indicador-icon.vermelho {
    background: #fff0f0;
    color: #e24a4a;
}

.indicador-icon.amarelo {
    background: #fff8df;
    color: #d79a00;
}

.indicador-icon.verde {
    background: #edf9f1;
    color: #29ad65;
}

.indicador-card span {
    display: block;

    color: #7d8792;

    font-size: 13px;

    margin-bottom: 6px;
}

.indicador-card strong {
    display: block;

    font-size: 27px;

    color: #27313c;
}


/* ================================
   CABEÇALHO CARD
================================ */

.card-header {
    margin-bottom: 20px;
}

.card-header h2 {
    font-size: 18px;

    margin-bottom: 6px;

    color: #29333e;
}

.card-header p {
    color: #89929d;

    font-size: 13px;
}


/* ================================
   AÇÕES RÁPIDAS
================================ */

.atalhos {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 12px;
}

.atalho {
    display: flex;

    align-items: center;

    gap: 10px;

    min-height: 55px;

    padding: 12px 15px;

    border: 1px solid #e2e7ed;

    border-radius: 9px;

    text-decoration: none;

    color: #34404c;

    font-size: 13px;

    font-weight: 600;

    background: #fff;

    transition: .2s;
}

.atalho:hover {
    border-color: #2864d7;

    color: #2864d7;

    transform: translateY(-1px);
}

.atalho span {
    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #edf4ff;

    color: #2864d7;

    border-radius: 8px;

    font-size: 18px;
}


/* ================================
   GRID INFERIOR
================================ */

.dashboard-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;

    margin-top: 20px;
}


/* ================================
   PROGRESSO
================================ */

.progresso-header {
    display: flex;

    justify-content: space-between;

    margin-bottom: 10px;

    font-size: 13px;

    color: #68737f;
}

.progresso-header strong {
    color: #2864d7;
}

.barra {
    height: 10px;

    width: 100%;

    background: #e8ebef;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 22px;
}

.barra-preenchida {
    width: 75%;

    height: 100%;

    background: #2864d7;

    border-radius: 20px;
}


/* ================================
   STATUS
================================ */

.status-linhas > div {
    display: flex;

    justify-content: space-between;

    padding: 13px 0;

    border-bottom: 1px solid #edf0f3;

    font-size: 14
