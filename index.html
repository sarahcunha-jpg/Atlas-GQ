<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Atlas Gestão - Sistema de Gestão da Qualidade"
    >

    <title>
        Atlas Gestão | Gestão da Qualidade
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: #1f2937;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

        }


        .login-logo {

            text-align: center;

            margin-bottom: 25px;

        }


        .logo-symbol {

            width: 60px;

            height: 60px;

            margin:
                0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #2563eb;

            color: white;

            border-radius: 15px;

            font-size: 28px;

            font-weight: bold;

        }


        .login-logo h1 {

            color: #2563eb;

            font-size: 28px;

            margin-bottom: 7px;

        }


        .login-logo p {

            color: #64748b;

            font-size: 14px;

        }


        .login-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                );

        }


        .login-card h2 {

            font-size: 22px;

            margin-bottom: 7px;

        }


        .login-card > p {

            color: #64748b;

            font-size: 13px;

            margin-bottom: 25px;

        }


        .login-form {

            display: flex;

            flex-direction: column;

            gap: 17px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .form-group label {

            font-size: 13px;

            font-weight: 600;

            color: #334155;

        }


        .form-group input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

        }


        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );

        }


        .login-opcoes {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

            font-size: 12px;

            color: #64748b;

        }


        .login-opcoes label {

            display: flex;

            align-items: center;

            gap: 6px;

        }


        .login-opcoes a {

            color: #2563eb;

            text-decoration: none;

        }


        .login-opcoes a:hover {

            text-decoration: underline;

        }


        .btn {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 13px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

        }


        .btn-primary {

            background: #2563eb;

            color: white;

        }


        .btn-primary:hover {

            background: #1d4ed8;

        }


        .btn-primary:disabled {

            opacity: 0.7;

            cursor: wait;

        }


        .mensagem {

            display: none;

            padding: 11px;

            border-radius: 8px;

            font-size: 12px;

        }


        .mensagem.sucesso {

            display: block;

            background: #f0fdf4;

            color: #15803d;

            border:
                1px solid #bbf7d0;

        }


        .mensagem.erro {

            display: block;

            background: #fef2f2;

            color: #b91c1c;

            border:
                1px solid #fecaca;

        }


        .rodape {

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            font-size: 11px;

        }


        @media (max-width: 480px) {

            .login-card {

                padding: 22px;

            }


            .login-logo h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <main class="login-container">


        <div class="login-logo">

            <div class="logo-symbol">
                ▲
            </div>

            <h1>
                Atlas Gestão
            </h1>

            <p>
                Gestão Inteligente da Qualidade
            </p>

        </div>


        <section class="login-card">

            <h2>
                Bem-vindo
            </h2>

            <p>
                Entre para acessar o Sistema de Gestão da Qualidade.
            </p>


            <form
                id="loginForm"
                class="login-form"
            >


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-opcoes">

                    <label>

                        <input
                            type="checkbox"
                            id="manterConectado"
                        >

                        Manter conectado

                    </label>


                    <a
                        href="#"
                        id="esqueciSenha"
                    >
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="btnLogin"
                >
                    Entrar
                </button>


                <div
                    id="mensagemLogin"
                    class="mensagem"
                ></div>


            </form>

        </section>


        <div class="rodape">

            Atlas Gestão © 2026

        </div>


    </main>


    <script src="./js/app.js"></script>

    <script src="./js/login.js"></script>


</body>

</html>
