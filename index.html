<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atlas Gestão - Login</title>

    <link
        rel="stylesheet"
        href="frontend/css/style.css"
    >
</head>

<body class="login-body">

    <main class="login-container">

        <div class="login-logo">

            <div class="logo-symbol">
                ▲
            </div>

            <h1>Atlas Gestão</h1>

            <p>
                Gestão Inteligente da Qualidade
            </p>

        </div>


        <div class="login-card">

            <h2>Entrar</h2>

            <p>
                Acesse o sistema de gestão.
            </p>


            <form
                id="loginForm"
                class="login-form"
            >

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        id="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <div class="login-opcoes">

                    <label>

                        <input
                            type="checkbox"
                            id="lembrar"
                        >

                        Lembrar-me

                    </label>


                    <a
                        href="#"
                        id="esqueciSenha"
                    >
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Entrar
                </button>


                <div
                    id="mensagem"
                    class="mensagem"
                ></div>

            </form>

        </div>

    </main>


    <script src="frontend/js/login.js"></script>

</body>

</html>
