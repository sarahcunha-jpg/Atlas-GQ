<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atlas Gestão - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <!-- LOGO -->

        <div class="login-brand">

            <div class="brand-icon">
                ▲
            </div>

            <h1>
                Atlas Gestão
            </h1>

            <p>
                Gestão Inteligente da Qualidade
            </p>

        </div>


        <!-- LOGIN -->

        <section class="login-card">

            <h2>
                Entrar
            </h2>

            <p>
                Acesse o sistema de gestão da qualidade.
            </p>


            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="seu@email.com"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    id="senha"
                    type="password"
                    placeholder="Digite sua senha"
                    required
                >


                <div class="login-options">

                    <label class="remember">

                        <input
                            id="lembrar"
                            type="checkbox"
                        >

                        <span>
                            Lembrar acesso
                        </span>

                    </label>


                    <a
                        href="#"
                        id="esqueciSenha"
                    >
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-primary btn-full"
                >
                    Entrar
                </button>


                <div
                    id="mensagem"
                    class="message"
                ></div>

            </form>


            <!-- AVISO -->

            <div class="demo-box">

                <strong>
                    Acesso de demonstração
                </strong>

                <span>
                    Use qualquer e-mail válido e uma senha
                    com 4 ou mais caracteres.
                </span>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
