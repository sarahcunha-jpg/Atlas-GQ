<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>
        Atlas Gestão - Login
    </title>

    <!-- CSS CORRETO -->
    <link
        rel="stylesheet"
        href="./frontend/css/style.css"
    >

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">

            <div class="logo-icon">
                ▲
            </div>

            <div>

                <div class="logo-title">
                    Atlas Gestão
                </div>

                <div class="logo-subtitle">
                    Gestão Inteligente da Qualidade
                </div>

            </div>

        </div>



        <!-- CABEÇALHO -->

        <div class="login-header">

            <h1>
                Bem-vindo
            </h1>

            <p>
                Entre para acessar o Sistema de Gestão da Qualidade.
            </p>

        </div>



        <!-- LOGIN -->

        <form
            id="loginForm"
            class="login-form"
        >


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>



            <div class="login-opcoes">

                <label class="lembrar">

                    <input
                        type="checkbox"
                        id="lembrar"
                    >

                    <span>
                        Lembrar-me
                    </span>

                </label>


                <a
                    href="#"
                    id="esqueciSenha"
                >
                    Esqueci minha senha
                </a>

            </div>



            <button
                type="submit"
                class="btn-login"
            >
                Entrar
            </button>



            <div
                id="mensagem"
                class="mensagem"
            ></div>


        </form>


    </div>



    <footer>

        Atlas Gestão © 2026

    </footer>


</div>



<!-- JAVASCRIPT CORRETO -->

<script src="./frontend/js/login.js"></script>

</body>

</html>
